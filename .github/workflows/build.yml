# Compilation automatique : produit ConvertiaStudio (Windows) et
# ConvertiaStudio-linux.tar.gz (Ubuntu) à chaque étiquette « v* ».
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller>=6.10" "numpy>=1.26" "PySide6>=6.6"
      - name: ffmpeg
        run: |
          curl -L -o ffmpeg.zip https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          New-Item -ItemType Directory -Force bin | Out-Null
          Get-ChildItem -Recurse -Filter ffmpeg.exe ffmpeg | Copy-Item -Destination bin
          Get-ChildItem -Recurse -Filter ffprobe.exe ffmpeg | Copy-Item -Destination bin
      - name: Build
        run: |
          python build/make_icon.py
          python -m PyInstaller --noconfirm --clean build/convertia_studio.spec
      - uses: actions/upload-artifact@v4
        with:
          name: ConvertiaStudio-win64
          path: dist/ConvertiaStudio

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libxkbcommon0
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller>=6.10" "numpy>=1.26" "PySide6>=6.6"
      - name: Build
        run: |
          mkdir -p bin && cp "$(command -v ffmpeg)" bin/ && cp "$(command -v ffprobe)" bin/
          python build/make_icon.py
          python -m PyInstaller --noconfirm --clean build/convertia_studio.spec
          tar czf ConvertiaStudio-linux.tar.gz -C dist ConvertiaStudio
      - uses: actions/upload-artifact@v4
        with:
          name: ConvertiaStudio-linux
          path: ConvertiaStudio-linux.tar.gz
